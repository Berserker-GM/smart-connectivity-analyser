name: Smart Connectivity Analyser Tests

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  javascript-tests:
    name: JavaScript Syntax and Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check JavaScript syntax
        run: node --check js/script.js

      - name: Run JavaScript tests
        run: npm test

  python-tests:
    name: Python Frontend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run frontend metric formatting tests
        run: python -m unittest tests/test_frontend_metric_formatting.py
