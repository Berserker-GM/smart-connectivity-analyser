```yaml
name: Smart Connectivity Analyser Tests

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  javascript-checks:
    name: JavaScript Syntax and Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check JavaScript syntax
        run: node --check js/script.js

      - name: Run JavaScript tests if configured
        shell: bash
        run: |
          if [ -f package.json ]; then
            npm install
            npm test --if-present
          else
            echo "No package.json in repository root; skipping npm tests."
          fi

  python-checks:
    name: Python Frontend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run frontend metric formatting tests
        shell: bash
        run: |
          if [ -f tests/test_frontend_metric_formatting.py ]; then
            python tests/test_frontend_metric_formatting.py
          else
            echo "ERROR: Python test file was not found."
            exit 1
          fi
```
