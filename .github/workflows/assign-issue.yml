name: Automatic Issue Assignment

on:
  issue_comment:
    types: [created]
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  post-assignment-instructions:
    if: >-
      github.event_name == 'issues' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Add instructions to new or existing issues
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const marker = '<!-- automatic-assignment-instructions -->';

            const message = `${marker}
            👋 **Want to contribute to this issue?**

            Thank you for your interest in contributing to Smart Connectivity Analyser as part of WoCS 2026! 🚀

            **How to claim this issue:**
            1. Read the issue description and contribution guidelines.
            2. Check that the issue is open and unassigned.
            3. Comment exactly \`/assign\` below.
            4. GitHub Actions will assign the issue if it is available and you have fewer than 3 open assigned issues.

            **Contributor limit:** You can have a maximum of 3 open issues assigned to you at a time. Close or release an issue before claiming another.

            Happy contributing! 🎉`;

            async function addInstructions(issue) {
              if (issue.pull_request || issue.state !== 'open') {
                return;
              }

              const comments = await github.paginate(
                github.rest.issues.listComments,
                {
                  owner,
                  repo,
                  issue_number: issue.number,
                  per_page: 100
                }
              );

              if (comments.some(c => c.body.includes(marker))) {
                console.log(`Instructions already exist on #${issue.number}`);
                return;
              }

              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issue.number,
                body: message
              });

              console.log(`Instructions added to #${issue.number}`);
            }

            if (context.eventName === 'issues') {
              await addInstructions(context.payload.issue);
            } else {
              const issues = await github.paginate(
                github.rest.issues.listForRepo,
                {
                  owner,
                  repo,
                  state: 'open',
                  per_page: 100
                }
              );

              for (const issue of issues) {
                await addInstructions(issue);
              }
            }

  assign-issue:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request == null &&
      github.event.comment.body == '/assign'
    runs-on: ubuntu-latest

    steps:
      - name: Assign issue to commenter
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const username = context.payload.comment.user.login;

            if (context.payload.comment.user.type === 'Bot') {
              return;
            }

            const issue = {
              owner,
              repo,
              issue_number
            };

            const { data: currentIssue } =
              await github.rest.issues.get(issue);

            if (currentIssue.state !== 'open') {
              await github.rest.issues.createComment({
                ...issue,
                body: 'Sorry, this issue is closed. Please choose an open issue.'
              });
              return;
            }

            if (currentIssue.assignees.length > 0) {
              await github.rest.issues.createComment({
                ...issue,
                body: 'Sorry, this issue is already assigned. Please choose another available issue.'
              });
              return;
            }

            // Count this contributor's other open assigned issues.
            const allIssues = await github.paginate(
              github.rest.issues.listForRepo,
              {
                owner,
                repo,
                state: 'open',
                per_page: 100
              }
            );

            const assignedCount = allIssues.filter(item =>
              !item.pull_request &&
              item.number !== issue_number &&
              item.assignees.some(
                assignee => assignee.login === username
              )
            ).length;

            const MAX_ISSUES = 3;

            if (assignedCount >= MAX_ISSUES) {
              await github.rest.issues.createComment({
                ...issue,
                body: `@${username} you already have ${assignedCount} open assigned issues. The maximum is ${MAX_ISSUES} at a time. Please complete or release an assigned issue before claiming another.`
              });
              return;
            }

            await github.rest.issues.addAssignees({
              ...issue,
              assignees: [username]
            });

            await github.rest.issues.createComment({
              ...issue,
              body: `@${username} has been assigned this issue! You now have up to ${assignedCount + 1} of ${MAX_ISSUES} allowed open assigned issues. Happy contributing! 🚀`
            });
