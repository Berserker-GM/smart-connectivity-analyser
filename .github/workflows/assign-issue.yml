name: Automatic Issue Assignment

on:
  issue_comment:
    types: [created]

permissions:
  issues: write
  contents: read

jobs:
  assign-issue:
    if: >-
      github.event.issue.pull_request == null &&
      github.event.comment.body == '/assign'
    runs-on: ubuntu-latest

    steps:
      - name: Assign issue to commenter
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const username = context.payload.comment.user.login;

            if (context.payload.comment.user.type === 'Bot') {
              return;
            }

            const issue = {
              owner,
              repo,
              issue_number
            };

            const { data: currentIssue } =
              await github.rest.issues.get(issue);

            if (currentIssue.assignees.length > 0) {
              await github.rest.issues.createComment({
                ...issue,
                body: 'Sorry, this issue is already assigned. Please choose another issue.'
              });
              return;
            }

            await github.rest.issues.addAssignees({
              owner,
              repo,
              issue_number,
              assignees: [username]
            });

            await github.rest.issues.createComment({
              ...issue,
              body: `@${username} has been assigned this issue. Happy contributing! 🚀`
            });
